version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishirakshak-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - YOLO_MODEL_PATH=${YOLO_MODEL_PATH:-}
      - YOLO_MODEL_NAME=${YOLO_MODEL_NAME:-yolov8n-cls.pt}
      - YOLO_CONFIDENCE_THRESHOLD=${YOLO_CONFIDENCE_THRESHOLD:-0.25}
    volumes:
      - ./data:/app/data:ro
      - chroma_data:/app/chroma_db
      - yolo_weights:/app/yolo_weights
    networks:
      - krishi_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: krishirakshak-streamlit
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./data:/app/data:ro
      - ./yolo_weights:/app/yolo_weights:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - krishi_net
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
  yolo_weights:
    driver: local

networks:
  krishi_net:
    driver: bridge
